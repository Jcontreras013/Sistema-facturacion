{% extends "base.html" %}
{% block title %}Eliminar cliente{% endblock %}
{% block content %}
<div class="confirm-delete-wrap">
<div class="card confirm-delete-card">
    <div class="confirm-delete-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h2>Eliminar cliente</h2>
    <p>¿Seguro que deseas eliminar al cliente <strong>{{ client.name }}</strong>?</p>
    <form method="post" class="confirm-delete-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'clients:client_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</div>
{% endblock %}
