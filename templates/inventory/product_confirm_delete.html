{% extends "base.html" %}
{% block title %}Eliminar producto{% endblock %}
{% block content %}
<h2>Eliminar producto</h2>
<div class="card p-4" style="max-width: 500px;">
    <p>¿Seguro que deseas eliminar el producto <strong>{{ product.name }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'inventory:product_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
