{% extends "base.html" %}
{% block title %}Ganancias{% endblock %}
{% block content %}
<h2><i class="bi bi-graph-up-arrow"></i> Reporte de ganancias</h2>
<form class="row g-2 mb-3">
    <div class="col-md-3">
        <label class="form-label small">Desde</label>
        <input type="date" name="from" value="{{ date_from|date:'Y-m-d' }}" class="form-control">
    </div>
    <div class="col-md-3">
        <label class="form-label small">Hasta</label>
        <input type="date" name="to" value="{{ date_to|date:'Y-m-d' }}" class="form-control">
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-outline-secondary w-100" type="submit">Filtrar</button>
    </div>
</form>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card stat-card p-3 bg-success text-white">
            <div class="small">Ingresos totales</div>
            <div class="fs-3 fw-bold">Q {{ total_revenue|floatformat:2 }}</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-3 bg-secondary text-white">
            <div class="small">Costo de productos vendidos</div>
            <div class="fs-3 fw-bold">Q {{ total_cost|floatformat:2 }}</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card p-3 bg-primary text-white">
            <div class="small">Ganancia bruta</div>
            <div class="fs-3 fw-bold">Q {{ total_profit|floatformat:2 }}</div>
        </div>
    </div>
</div>
{% endblock %}
