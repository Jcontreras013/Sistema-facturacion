{% extends "base.html" %}
{% block title %}Abrir caja{% endblock %}
{% block content %}
<div class="page-header">
    <div class="page-header-title">
        <div class="page-header-icon"><i class="bi bi-safe"></i></div>
        <div>
            <h2>Abrir caja</h2>
            <p class="page-header-subtitle">Registra el monto inicial para comenzar a vender</p>
        </div>
    </div>
</div>
<div class="card p-4" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Monto inicial en caja</label>
            <input type="number" step="0.01" min="0" name="opening_amount" class="form-control" value="0.00" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">Abrir caja</button>
    </form>
</div>
{% endblock %}
